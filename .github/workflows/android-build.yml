name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-build-cache --no-configuration-cache --stacktrace --console=plain 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlquranPro-build-log
          path: build.log
          if-no-files-found: warn
      - name: Expose compiler diagnostics
        if: failure()
        run: |
          echo "Build diagnostics:"
          grep -E 'What went wrong|Could not|e: |FAILURE|Execution failed' build.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlquranPro-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
